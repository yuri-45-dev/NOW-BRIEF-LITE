name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 36 command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # No binary gradle-wrapper.jar is committed to this repo (it cannot be
      # generated offline), so the job calls the `gradle` binary that
      # setup-gradle just put on PATH instead of ./gradlew. If you regenerate
      # the wrapper locally with `gradle wrapper --gradle-version 8.9`, you
      # can switch this step back to `./gradlew assembleRelease`.
      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowBriefCapsule-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
