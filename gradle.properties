org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.2 was only tested up through compileSdk 35; this project intentionally
# targets 36 (Android 16) per the project brief, so the warning is suppressed
# rather than worked around. It is a warning only — it never failed the build.
android.suppressUnsupportedCompileSdk=36
